global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "litellm"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["litellm:4000"]

  # Compose profile security — hybrid prompt I/O scanner
  - job_name: "prompt-io"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["prompt-io:5050"]

  # Optional LLMTrace shadow proxy (same profile; scrape may 404 if image differs)
  - job_name: "llmtrace"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["llmtrace:8080"]
