# MRGPU worker plane. Cloud credentials are deliberately absent in the overlay.
model_list:
  - model_name: manager-worker-mrgpu-code
    litellm_params: &code
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8
      presence_penalty: 0
  - model_name: manager-worker-mrgpu-research
    litellm_params: *code
  - model_name: manager-worker-mrgpu-reason
    litellm_params: &reason
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8
  - model_name: manager-worker-mrgpu-review
    litellm_params: *reason
  - model_name: manager-worker-mrgpu-vision
    litellm_params: {model: ollama_chat/qwen3-vl:8b, api_base: os.environ/OLLAMA_API_BASE}
  - model_name: manager-worker-mrgpu-phi
    litellm_params: *code
  - model_name: manager-embed
    litellm_params: {model: openai/nomic-embed-text-v2-moe:latest, api_base: os.environ/OLLAMA_OPENAI_API_BASE, api_key: local}
  # deepseek-r1:14b already pulled (9.0GB) — fits comfortably. THINKING model:
  # fine for real reasoning traffic; do NOT point PMB's internal maintenance
  # calls (track modules / consolidate) at it.
  - model_name: manager-worker-mrgpu-deepseek-reason
    litellm_params:
      model: ollama_chat/deepseek-r1:14b
      api_base: os.environ/OLLAMA_API_BASE
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8
  # ---- manager-test-* : opt-in mrgpu load-testing aliases ----------------
  # Pulled on gpu-host, not yet load-tested against the daily-driver pins
  # above. Explicit-call-only (empty fallback chains below) so none of these
  # can ever be silently reached by manager-worker-mrgpu-code / etc.
  - model_name: manager-test-gpt-oss-20b
    # gpt-oss:20b (13.8GB) — fits the 16GB card fully on its own, no CPU
    # offload. Strongest untested general/coding candidate.
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: os.environ/OLLAMA_API_BASE
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8
  - model_name: manager-test-qwen3-5-27b
    # qwen3.5:27b-q4_K_M (17.4GB) — exceeds the 16GB card by ~1GB, partial
    # CPU offload. Slower, usable for A/B quality checks vs the 9B pin.
    litellm_params:
      model: ollama_chat/qwen3.5:27b-q4_K_M
      api_base: os.environ/OLLAMA_API_BASE
      num_ctx: 16384
      temperature: 0.2
      top_p: 0.8
  - model_name: manager-test-qwen3-coder-30b
    # qwen3-coder:30b (18.6GB) — heaviest pull, largest CPU-offload overhead.
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: os.environ/OLLAMA_API_BASE
      num_ctx: 16384
      temperature: 0.2
      top_p: 0.8
  - model_name: manager-test-embed-bge-m3
    # bge-m3 (1.16GB, 8192-token ctx, 1024-dim) — now PMB's actual
    # production embedder on this host (2026-08-10: switched from
    # nomic-embed-text-v2-moe, whose 512-token ctx 500'd on normal-length
    # markdown/log paragraphs).
    litellm_params:
      model: ollama_chat/bge-m3
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: manager-test-law-model
    # initium/law_model (7B) — pulled domain model, no current consumer.
    litellm_params:
      model: ollama_chat/initium/law_model
      api_base: os.environ/OLLAMA_API_BASE
  # ---- end manager-test-* ------------------------------------------------
litellm_settings:
  callbacks: [prometheus]
  drop_params: true
  telemetry: false
  store_prompts_in_spend_logs: false
router_settings:
  num_retries: 0
  fallbacks:
    - manager-test-gpt-oss-20b: []
    - manager-test-qwen3-5-27b: []
    - manager-test-qwen3-coder-30b: []
    - manager-test-embed-bge-m3: []
    - manager-test-law-model: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
