  - model_name: manager-worker-mrgpu-vision
    litellm_params:
      model: ollama_chat/qwen3-vl:8b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
  - model_name: manager-worker-gpu-host-phi
    litellm_params: *mrgpu_coding_pin
  - model_name: manager-worker-mrgpu-phi
    litellm_params: *mrgpu_coding_pin

  # ---- manager-test-* : opt-in mrgpu load-testing aliases ----------------
  # Pulled on gpu-host, not yet load-tested against the daily-driver pins
  # above. Explicit-call-only (empty fallback chains below) so none of these
  # can ever be silently reached by manager-code / tier-nvidia-fast / etc.
  # Never add these to another alias's fallback list.

  # gpt-oss:20b (13.8GB) — fits the 16GB card fully on its own, no CPU
  # offload. Strongest untested general/coding candidate; a reasonable first
  # promotion candidate once load-tested against qwen3.5:9b / the 14b coder.
  - model_name: manager-test-gpt-oss-20b
