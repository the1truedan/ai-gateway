# Fallbacks MUST live under router_settings (or litellm_settings).
# Top-level `fallbacks:` is ignored by LiteLLM 1.92+ → Fallbacks=None → hard 500s.
litellm_settings:
  callbacks: ["prometheus"]
  drop_params: true
  request_timeout: 600
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 30
  telemetry: false
  store_prompts_in_spend_logs: false
  maximum_spend_logs_retention_period: "90d"
  default_fallbacks: [manager-fast-local]

# Guardrails — layered purview with M.A.N.A.G.E.R. (see litellm_config.yaml + config/security/README.md)
# Guardrails are opt-in via guardrails[] / tags so coding-tool content is not rejected.
guardrails:
  - guardrail_name: credentials-block
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: false
      patterns:
        - pattern_type: prebuilt
          pattern_name: aws_access_key
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: aws_secret_key
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: github_token
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: slack_token
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: generic_api_key
          action: BLOCK

  - guardrail_name: baseline-pii-mask
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: false
      patterns:
        - pattern_type: prebuilt
          pattern_name: us_ssn
          action: MASK
        - pattern_type: prebuilt
          pattern_name: email
          action: MASK
        - pattern_type: prebuilt
          pattern_name: us_phone
          action: MASK
        - pattern_type: prebuilt
          pattern_name: credit_card
          action: MASK
        - pattern_type: prebuilt
          pattern_name: visa
          action: MASK
        - pattern_type: prebuilt
          pattern_name: mastercard
          action: MASK
      pattern_redaction_format: "[{pattern_name}_REDACTED]"

  - guardrail_name: claims-agent-safety
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: false
      categories:
        - category: claims_fraud_coaching
          enabled: true
          action: BLOCK
          severity_threshold: medium
        - category: claims_phi_disclosure
          enabled: true
          action: BLOCK
          severity_threshold: medium
        - category: claims_prior_auth_gaming
          enabled: true
          action: BLOCK
          severity_threshold: medium
        - category: claims_system_override
          enabled: true
          action: BLOCK
          severity_threshold: medium
        - category: claims_medical_advice
          enabled: true
          action: BLOCK
          severity_threshold: high

  - guardrail_name: hybrid-prompt-io-during
    litellm_params:
      guardrail: hybrid_prompt_io.HybridPromptIOGuardrail
      mode: during_call
      default_on: true
      api_base: os.environ/PROMPT_IO_BASE
  - guardrail_name: hybrid-prompt-io-post
    litellm_params:
      guardrail: hybrid_prompt_io.HybridPromptIOGuardrail
      mode: post_call
      default_on: true
      api_base: os.environ/PROMPT_IO_BASE

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - manager-reasoning-turbo: [manager-reasoning-local, manager-reasoning-deepseek]
    - manager-reasoning-local: [manager-reasoning-deepseek]
    - manager-reasoning-deepseek: [manager-reasoning-local]
    - manager-reasoning-cloud: []
    - manager-fast-turbo: [manager-fast-local]
    - manager-fast-local: []
    - tier-local-fast: [manager-fast-local]
    - tier-local-reason: [manager-reasoning-local, manager-reasoning-deepseek]
    - tier-nvidia-fast: [tier-nvidia-agent, manager-fast-local]
    - tier-nvidia-agent: [manager-reasoning-local]
    - tier-nvidia-reason: [manager-reasoning-local, manager-reasoning-deepseek]
    - manager-fast-cuda: [manager-fast-local]
    - manager-heavy-cuda: [manager-reasoning-local, manager-reasoning-deepseek]
    # Coding workers: empty chain — fail closed, never silent 27B/30B spill
    - manager-worker-gpu-host-code: []
    - manager-worker-mrgpu-code: []
    - manager-worker-gpu-host-reason: [manager-worker-gpu-host-code]
    - manager-worker-mrgpu-reason: [manager-worker-mrgpu-code]
    - manager-worker-gpu-host-research: [manager-worker-gpu-host-reason]
    - manager-worker-mrgpu-research: [manager-worker-mrgpu-reason]
    - manager-worker-gpu-host-review: [manager-worker-gpu-host-reason]
    - manager-worker-mrgpu-review: [manager-worker-mrgpu-reason]
    - manager-worker-gpu-host-vision: []
    - manager-worker-mrgpu-vision: []
    - manager-worker-gpu-host-phi: []
    - manager-worker-mrgpu-phi: []
    # manager-test-*: opt-in only, never a fallback target and never appear
    # in another alias's chain (see model_list comment block above).
    - manager-test-gpt-oss-20b: []
    - manager-test-qwen3-5-27b: []
    - manager-test-qwen3-coder-30b: []
    - manager-test-embed-bge-m3: []
    - manager-test-law-model: []
