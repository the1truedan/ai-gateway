# Linux / Unraid overlay — same routes as litellm_config.yaml with host-reachable API bases.
# Set OLLAMA_HOST_IP / TURBOQUANT_HOST_IP in .env (e.g. <nas-host-ip-alt>).
# Optional remote GPU: VLLM_API_BASE or TURBOQUANT_CUDA_API_BASE (PopOS 4060 Ti / Unraid P2000).
# This is the gpu-host worker catalog. Cloud aliases may remain for temporary
# compatibility, but credentials are not injected and no automatic route can
# reach them. The Mac manager owns every cloud decision.

model_list:
  - model_name: manager-fast-local
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_API_BASE

  # gpu-host Ollama 0.32+ has gemma4:12b (was gemma3:12b stand-in pre-0.23.2+)
  - model_name: manager-reasoning-local
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE

  # DeepSeek-R1 distill 14B — math/multi-step specialist on 4060 Ti 16GB (~9 GB Q4)
  - model_name: manager-reasoning-deepseek
    litellm_params:
      model: ollama_chat/deepseek-r1:14b
      api_base: os.environ/OLLAMA_API_BASE

  # Terminal PHI fallback target. Its explicit empty fallback chain prevents
  # the global/cloud defaults from being considered after both PHI models fail.
  - model_name: manager-phi-reason-local
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: manager-reasoning-turbo
    litellm_params:
      model: openai/gemma4-orchestrator
      api_base: os.environ/TURBOQUANT_ORCH_API_BASE
      api_key: local

  - model_name: manager-fast-turbo
    litellm_params:
      model: openai/qwen-coder
      api_base: os.environ/TURBOQUANT_CODER_API_BASE
      api_key: local

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: claude-opus-4-7
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: manager-ocr-local
    litellm_params:
      model: ollama_chat/glm-ocr:latest
      api_base: os.environ/OLLAMA_API_BASE

  # Bleeding-edge OCR alt (token-efficient); pick via model name deepseek-ocr if preferred
  - model_name: manager-ocr-deepseek
    litellm_params:
      model: ollama_chat/deepseek-ocr:latest
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: manager-translate-el
    litellm_params:
      model: ollama_chat/translategemma:4b
      api_base: os.environ/OLLAMA_API_BASE

  # Prefer installed VLMs on 4060 Ti 16GB (qwen3-vl primary; qwen2.5vl secondary alias)
  - model_name: manager-vision-local
    litellm_params:
      model: ollama_chat/qwen3-vl:8b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: manager-vision-qwen25
    litellm_params:
      model: ollama_chat/qwen2.5vl:7b
      api_base: os.environ/OLLAMA_API_BASE

