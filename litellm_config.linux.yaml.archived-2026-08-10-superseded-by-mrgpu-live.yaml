  - model_name: manager-vision-embed
    litellm_params:
      model: openai/manager-vision-embed
      api_base: os.environ/VISION_EMBED_API_BASE
      api_key: local

  - model_name: manager-llama-local
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_API_BASE

  # TEMP: gpt-oss:20b-cloud until Ollama plan unlocks glm-5.2:cloud
  - model_name: manager-reasoning-cloud
    litellm_params:
      model: ollama_chat/gpt-oss:20b-cloud
      api_base: os.environ/OLLAMA_API_BASE

  # Local embeddings (Hister / RAG)
  - model_name: manager-embed
    litellm_params:
      model: openai/nomic-embed-text-v2-moe:latest
      api_base: os.environ/OLLAMA_API_BASE
      api_key: ollama

  # Stable tier aliases
  - model_name: tier-local-fast
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b-instruct-q5_K_M
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: tier-local-reason
    litellm_params:
      model: ollama_chat/deepseek-r1:14b
      api_base: os.environ/OLLAMA_API_BASE

  # gpu-host NVIDIA tiers. Ollama schedules these models on the RTX 4060 Ti;
  # keep the aliases stable if the serving engine changes later.
  - model_name: tier-nvidia-fast
    litellm_params: &mrgpu_coding_pin
      # Qwen 3.5 emits native OpenAI tool_calls; Qwen 2.5 Coder returned
      # tool requests as plain JSON content, which coding agents cannot execute.
      # CODING PIN: never point this block at qwen3.5:27b / qwen3-coder:30b.
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
      # LiteLLM's Ollama adapter otherwise leaves Ollama at its 4096-token
      # runtime default, even when clients advertise a 128K model window.
      num_ctx: 32768
      # Agent/tool loops need deterministic sampling. The upstream model's
      # baked defaults (temperature=1, presence_penalty=1.5) caused normal-EOS
      # truncation and hallucinated repository summaries after a tool result.
      temperature: 0.2
      top_p: 0.8
      presence_penalty: 0

  # Orchestration placement targets (manager-code → these). Empty fallbacks below.
  - model_name: manager-worker-gpu-host-code
    litellm_params: *mrgpu_coding_pin
  - model_name: manager-worker-mrgpu-code
    litellm_params: *mrgpu_coding_pin
  - model_name: manager-worker-gpu-host-reason
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8
  - model_name: manager-worker-mrgpu-reason
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8
  - model_name: manager-worker-gpu-host-research
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
      num_ctx: 32768
  - model_name: manager-worker-mrgpu-research
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
      num_ctx: 32768
  - model_name: manager-worker-gpu-host-review
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: os.environ/OLLAMA_API_BASE
      think: false
