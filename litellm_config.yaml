# ============================================
# LiteLLM Config for M.A.N.A.G.E.R. Project
# Claude Code + Understand-Anything gateway
# M4 24GB local + Gemini (Google One) + free/paid cloud
# ============================================
# Runtime (M4 24GB): one large local model at a time; embedders may stay resident.
# Fallback order: local → Gemini → free OpenRouter → paid xAI
# PHI / caregiver content: keep local; do not default to Gemini.

model_list:
  # ==========================================
  # LOCAL MODELS (Ollama on host - M4 Mac)
  # ==========================================
  - model_name: manager-fast-local
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://host.docker.internal:11434

  - model_name: manager-reasoning-local
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://host.docker.internal:11434

  # Terminal PHI fallback target; never participates in cloud fallbacks.
  - model_name: manager-phi-reason-local
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://host.docker.internal:11434

  # TurboQuant+ llama-server (M4 24GB — turbo KV, long agent context)
  # Host script: scripts/start_turboquant_server.sh
  - model_name: manager-reasoning-turbo
    litellm_params:
      model: openai/gemma4-orchestrator
      api_base: http://host.docker.internal:8081/v1
      api_key: local

  - model_name: manager-fast-turbo
    litellm_params:
      model: openai/qwen-coder
      api_base: http://host.docker.internal:8082/v1
      api_key: local

  # Claude Code aliases → route to local models by default
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://host.docker.internal:11434

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://host.docker.internal:11434

  - model_name: claude-opus-4-7
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://host.docker.internal:11434

  # M4 24GB staged specialists (Ollama)
  - model_name: manager-ocr-local
    litellm_params:
      model: ollama_chat/glm-ocr:latest
      api_base: http://host.docker.internal:11434

  - model_name: manager-translate-el
    litellm_params:
      model: ollama_chat/translategemma:4b
      api_base: http://host.docker.internal:11434

  # Vision + tools (same weights as reasoning; separate agent routing alias)
  - model_name: manager-vision-local
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://host.docker.internal:11434

  # Vision FEATURE encoder (FastAPI :8791) — spatial CLS/patch JSON, not a VLM
  # Host: ./scripts/start_vision_embed.sh
  - model_name: manager-vision-embed
    litellm_params:
      model: openai/manager-vision-embed
      api_base: http://host.docker.internal:8791/v1
      api_key: local

  # Llama baseline A/B only — llama3.1:8b (Llama 3.3 is 70B-only, not for 24GB)
  - model_name: manager-llama-local
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://host.docker.internal:11434

  # Ollama cloud — long-horizon (non-PHI engineering only)
  # TEMP: gpt-oss:20b-cloud until Ollama plan unlocks glm-5.2:cloud
  - model_name: manager-reasoning-cloud
    litellm_params:
      model: ollama_chat/gpt-oss:20b-cloud
      api_base: http://host.docker.internal:11434

  # Local embeddings (Hister / RAG) — Ollama nomic on host
  - model_name: manager-embed
    litellm_params:
      model: openai/nomic-embed-text-v2-moe:latest
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # ==========================================
  # LM STUDIO / MLX (host Developer Server :1234)
  # M4 24GB: opt-in; load one model via scripts/load_lmstudio_model.sh
  # Auth: LM_API_TOKEN in .env (LM Studio → Developer → API tokens)
  # ==========================================
  - model_name: manager-mlx-fast
    litellm_params:
      model: openai/google/gemma-3n-e4b
      api_base: http://host.docker.internal:1234/v1
      api_key: os.environ/LM_API_TOKEN

  - model_name: manager-lms-local
    litellm_params:
      model: openai/qwen/qwen3.5-9b
      api_base: http://host.docker.internal:1234/v1
      api_key: os.environ/LM_API_TOKEN

  - model_name: manager-lms-vision
    litellm_params:
      model: openai/google/gemma-4-e4b
      api_base: http://host.docker.internal:1234/v1
      api_key: os.environ/LM_API_TOKEN

  # ==========================================
  # STABLE TIER ALIASES (agent-facing)
  # ==========================================
  - model_name: tier-local-fast
    litellm_params:
      model: openai/qwen-coder
      api_base: http://host.docker.internal:8082/v1
      api_key: local

  - model_name: tier-local-reason
    litellm_params:
      model: openai/gemma4-orchestrator
      api_base: http://host.docker.internal:8081/v1
      api_key: local

  - model_name: tier-local-mlx
    litellm_params:
      model: openai/google/gemma-3n-e4b
      api_base: http://host.docker.internal:1234/v1
      api_key: os.environ/LM_API_TOKEN

  - model_name: tier-free-cloud
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: tier-gemini
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Automatic/free use must use a distinct AI Studio project with billing off.
  - model_name: tier-gemini-free
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_FREE_API_KEY

  - model_name: tier-paid-cloud
    litellm_params:
      model: xai/grok-code-fast-1
      api_key: os.environ/XAI_API_KEY

  # Explicit paid aliases. Selecting one is the approval signal.
  - model_name: manager-codex-cloud
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY

  - model_name: tier-codex-cloud
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY

  - model_name: manager-mimo-cloud
    litellm_params:
      model: openai/mimo-v2.5-pro
      api_base: os.environ/MIMO_API_BASE
      api_key: os.environ/MIMO_API_KEY

  - model_name: tier-mimo-cloud
    litellm_params:
      model: openai/mimo-v2.5-pro
      api_base: os.environ/MIMO_API_BASE
      api_key: os.environ/MIMO_API_KEY

  # ==========================================
  # ROLE ALIASES — tiered orchestration (plan vs execute)
  # Cloud plans / free recon; local executes; PHI never leaves local.
  # Source: https://grok.com/share/c2hhcmQtNA_d07d2ee7-9ae1-4418-820d-7ea7a41e17b4
  # Keep manager-* / tier-* for backward compatibility; agents may pick role-*.
  # ==========================================
  - model_name: role-plan
    litellm_params:
      model: openai/gemma4-orchestrator
      api_base: http://host.docker.internal:8081/v1
      api_key: local

  - model_name: tier-plan-cloud
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: role-recon
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://host.docker.internal:11434

  - model_name: role-execute
    litellm_params:
      model: openai/qwen-coder
      api_base: http://host.docker.internal:8082/v1
      api_key: local

  - model_name: tier-execute-local
    litellm_params:
      model: openai/qwen-coder
      api_base: http://host.docker.internal:8082/v1
      api_key: local

  - model_name: role-reason
    litellm_params:
      model: openai/gemma4-orchestrator
      api_base: http://host.docker.internal:8081/v1
      api_key: local

  # PHI / caregiver — hard-local only (no cloud in fallbacks)
  - model_name: role-phi-local
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://host.docker.internal:11434

  - model_name: role-audit
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://host.docker.internal:11434

  # ==========================================
  # WORKER ALIASES — raw authenticated :4000 endpoints only
  # ==========================================
  - model_name: gpu-host-role-plan
    litellm_params: &gpu_host_reason
      model: openai/role-reason
      api_base: os.environ/GPU_HOST_LITELLM_API_BASE
      api_key: os.environ/LITELLM_MASTER_KEY

  - model_name: gpu-host-role-recon
    litellm_params: *gpu_host_reason

  - model_name: gpu-host-role-execute
    litellm_params:
      model: openai/role-execute
      api_base: os.environ/GPU_HOST_LITELLM_API_BASE
      api_key: os.environ/LITELLM_MASTER_KEY

  - model_name: gpu-host-role-agent
    litellm_params:
      model: openai/tier-nvidia-agent
      api_base: os.environ/GPU_HOST_LITELLM_API_BASE
      api_key: os.environ/LITELLM_MASTER_KEY

  - model_name: gpu-host-role-reason
    litellm_params: *gpu_host_reason

  - model_name: gpu-host-role-phi-local
    litellm_params:
      model: openai/role-phi-local
      api_base: os.environ/GPU_HOST_LITELLM_API_BASE
      api_key: os.environ/LITELLM_MASTER_KEY

  - model_name: gpu-host-role-audit
    litellm_params: *gpu_host_reason

  - model_name: nas-host-worker-small-fast
    litellm_params:
      model: openai/nas-host-small-fast
      api_base: os.environ/NAS_HOST_LITELLM_API_BASE
      api_key: os.environ/LITELLM_MASTER_KEY

  - model_name: nas-host-worker-vision-local
    litellm_params:
      model: openai/nas-host-vision-local
      api_base: os.environ/NAS_HOST_LITELLM_API_BASE
      api_key: os.environ/LITELLM_MASTER_KEY

  # ==========================================
  # GOOGLE AI STUDIO (Gemini) — Google One
  # Account: you@example.com → GEMINI_API_KEY
  # Must use gemini/ prefix (not bare ids → Vertex)
  # Pin IDs: https://ai.google.dev/gemini-api/docs/models
  # gemini-2.5-flash blocked for new users (~2026-07) → use 3.5-flash
  # Privacy: opt-in cloud; never default for PHI
  # ==========================================
  - model_name: manager-gemini-fast
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: manager-gemini-agent
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: manager-gemini-vision
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Stable vision tier alias → local VLM (chat); use manager-vision-embed for features
  - model_name: tier-local-vision
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://host.docker.internal:11434

  # ==========================================
  # OPENROUTER — FREE ONLY (curated defaults)
  # Full catalog refreshed every 24h via scripts/sync_openrouter_free_models.py
  # Source filter: https://openrouter.ai/models?max_price=0
  # ==========================================
  - model_name: manager-big-context
    litellm_params:
      model: openrouter/qwen/qwen3-coder:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: manager-audit-claude
    litellm_params:
      model: openrouter/poolside/laguna-xs-2.1:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: manager-understand-audit
    litellm_params:
      model: openrouter/qwen/qwen3-coder:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: manager-openrouter-free
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  # ==========================================
  # DIRECT xAI (Grok Code Fast 1)
  # ==========================================
  - model_name: manager-grok-coding
    litellm_params:
      model: xai/grok-code-fast-1
      api_key: os.environ/XAI_API_KEY

# Auto-generated free OpenRouter aliases (or-free-*)
include:
  - openrouter_free_models.generated.yaml

# ==========================================
# LITELLM SETTINGS
# ==========================================
# Fallbacks MUST live under router_settings (or litellm_settings).
# Top-level `fallbacks:` is ignored by LiteLLM 1.92+ → Fallbacks=None → hard 500s.
litellm_settings:
  callbacks: ["prometheus"]
  drop_params: true
  request_timeout: 600
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 30
  telemetry: false
  store_prompts_in_spend_logs: false
  maximum_spend_logs_retention_period: "90d"
  # Safety net when a model has no explicit fallback chain
  default_fallbacks: [manager-fast-local, manager-gemini-fast, manager-openrouter-free]

# Guardrails — layered purview with M.A.N.A.G.E.R. (NARC/ETHICS/AIDA).
# LiteLLM = inference-bus net; agents still own consent/BAA/prepare-only/HITL.
#
# Hybrid prompt I/O (Vigil-compatible prompt-io + call_id join):
#   Requires compose profile `security` (prompt-io:5050). Fail-open when down.
#   Set PROMPT_IO_BLOCK=1 for fail-closed on scanner flags.
# content_filter (built-in, no external deps):
#   credentials-block  — opt-in (coding tools routinely inspect credential-shaped text)
#   baseline-pii-mask  — opt-in: attach via request guardrails[] or future policy tags
#                        Prefer for cloud routes; do NOT default-on for AIDA form-fill
#   claims-agent-safety — opt-in: claims/insurance agent keys only
# Per-request opt-in example:
#   "guardrails": ["baseline-pii-mask", "claims-agent-safety"]
guardrails:
  - guardrail_name: credentials-block
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: false
      patterns:
        - pattern_type: prebuilt
          pattern_name: aws_access_key
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: aws_secret_key
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: github_token
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: slack_token
          action: BLOCK
        - pattern_type: prebuilt
          pattern_name: generic_api_key
          action: BLOCK

  - guardrail_name: baseline-pii-mask
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: false
      patterns:
        - pattern_type: prebuilt
          pattern_name: us_ssn
          action: MASK
        - pattern_type: prebuilt
          pattern_name: email
          action: MASK
        - pattern_type: prebuilt
          pattern_name: us_phone
          action: MASK
        - pattern_type: prebuilt
          pattern_name: credit_card
          action: MASK
        - pattern_type: prebuilt
          pattern_name: visa
          action: MASK
        - pattern_type: prebuilt
          pattern_name: mastercard
          action: MASK
      pattern_redaction_format: "[{pattern_name}_REDACTED]"

  - guardrail_name: claims-agent-safety
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: false
      categories:
        - category: claims_fraud_coaching
          enabled: true
          action: BLOCK
          severity_threshold: medium
        - category: claims_phi_disclosure
          enabled: true
          action: BLOCK
          severity_threshold: medium
        - category: claims_prior_auth_gaming
          enabled: true
          action: BLOCK
          severity_threshold: medium
        - category: claims_system_override
          enabled: true
          action: BLOCK
          severity_threshold: medium
        - category: claims_medical_advice
          enabled: true
          action: BLOCK
          severity_threshold: high

  - guardrail_name: hybrid-prompt-io-during
    litellm_params:
      guardrail: hybrid_prompt_io.HybridPromptIOGuardrail
      mode: during_call
      default_on: true
      api_base: os.environ/PROMPT_IO_BASE
  - guardrail_name: hybrid-prompt-io-post
    litellm_params:
      guardrail: hybrid_prompt_io.HybridPromptIOGuardrail
      mode: post_call
      default_on: true
      api_base: os.environ/PROMPT_IO_BASE

# Router knobs. Local and role aliases never cross the cloud boundary.
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - manager-reasoning-turbo: [manager-reasoning-local, manager-gemini-agent, manager-grok-coding, manager-openrouter-free]
    - manager-reasoning-local: [manager-gemini-agent, manager-reasoning-cloud, manager-grok-coding, manager-openrouter-free]
    - manager-reasoning-cloud: [manager-gemini-agent, manager-grok-coding, manager-openrouter-free]
    - manager-fast-turbo: [manager-fast-local, manager-gemini-fast, manager-grok-coding, manager-openrouter-free]
    - manager-fast-local: [manager-gemini-fast, manager-grok-coding, manager-openrouter-free]
    - manager-mlx-fast: [manager-fast-local, manager-gemini-fast, manager-grok-coding, manager-openrouter-free]
    - manager-lms-local: [manager-fast-local, manager-gemini-fast, manager-grok-coding, manager-openrouter-free]
    - manager-lms-vision: [manager-vision-local, manager-gemini-vision, manager-openrouter-free]
    - tier-local-mlx: [manager-mlx-fast, manager-fast-local, manager-gemini-fast, manager-openrouter-free]
    - tier-local-fast: [manager-fast-local]
    - tier-local-reason: [manager-reasoning-local]
    - manager-vision-local: [manager-gemini-vision, manager-openrouter-free]
    - manager-vision-embed: [manager-vision-local, manager-gemini-vision]
    - tier-local-vision: [manager-vision-local]
    - manager-llama-local: [manager-fast-local, manager-gemini-fast, manager-openrouter-free]
    - manager-gemini-fast: [manager-openrouter-free, manager-grok-coding]
    - manager-gemini-agent: [manager-gemini-fast, manager-grok-coding, manager-openrouter-free]
    - manager-gemini-vision: [manager-gemini-fast, manager-openrouter-free]
    - tier-gemini: [manager-openrouter-free, manager-grok-coding]
    - tier-gemini-free: [manager-openrouter-free]
    # Role aliases are local by default; cloud aliases require explicit selection.
    - role-plan: [manager-reasoning-local]
    - tier-plan-cloud: [role-plan, manager-gemini-fast, manager-openrouter-free]
    - role-recon: [manager-reasoning-local]
    - role-execute: [manager-fast-turbo, manager-fast-local]
    - tier-execute-local: [role-execute, manager-fast-turbo, manager-fast-local]
    - role-reason: [manager-reasoning-turbo, manager-reasoning-local]
    - role-phi-local: [manager-phi-reason-local]
    - manager-phi-reason-local: []
    - role-audit: [manager-reasoning-local]
    # The manager selects a host before these aliases are called. Cross-host
    # fallback would violate fail-closed routing and make route metadata false.
    - gpu-host-role-plan: []
    - gpu-host-role-recon: []
    - gpu-host-role-execute: []
    - gpu-host-role-agent: []
    - gpu-host-role-reason: []
    - gpu-host-role-phi-local: []
    - gpu-host-role-audit: []
    - nas-host-worker-small-fast: []
    - nas-host-worker-vision-local: []
    - manager-big-context: [manager-audit-claude, manager-openrouter-free, manager-gemini-fast]
    - manager-understand-audit: [manager-big-context, manager-audit-claude, manager-openrouter-free]
    - manager-audit-claude: [manager-openrouter-free, manager-grok-coding]
    - manager-codex-cloud: [manager-openrouter-free]
    - tier-codex-cloud: [manager-codex-cloud, manager-openrouter-free]
    - manager-mimo-cloud: [manager-openrouter-free]
    - tier-mimo-cloud: [manager-mimo-cloud, manager-openrouter-free]
    - claude-sonnet-4-6: [manager-gemini-fast, manager-openrouter-free, manager-grok-coding]
    - claude-opus-4-7: [manager-gemini-agent, manager-openrouter-free, manager-grok-coding]
    - claude-haiku-4-5-20251001: [manager-gemini-fast, manager-openrouter-free]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Required for Admin UI login, virtual keys, users, spend tracking
  database_url: os.environ/DATABASE_URL
