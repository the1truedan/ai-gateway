# Mac client worker bus — orchestration placement targets only.
# Headroom/orchestrator map manager-* → manager-worker-m4-*.
# Keep this slim so the admin models view reflects healthy local workers,
# not every optional turbo/cloud alias from the full hub catalog.
#
# think: false is required for qwen3.5 (otherwise thinking tokens burn the
# completion budget and chat completions hang/time out).

model_list:
  - model_name: manager-worker-m4-code
    litellm_params: &m4_fast
      model: ollama_chat/qwen3.5:9b
      api_base: http://host.docker.internal:11434
      think: false
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8
      presence_penalty: 0

  - model_name: manager-worker-m4-research
    litellm_params: *m4_fast

  - model_name: manager-worker-m4-reason
    litellm_params: &m4_reason
      model: ollama_chat/gemma4:12b
      api_base: http://host.docker.internal:11434
      think: false
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8

  - model_name: manager-worker-m4-review
    litellm_params: *m4_reason

  - model_name: manager-worker-m4-vision
    litellm_params:
      model: ollama_chat/qwen3-vl:8b
      api_base: http://host.docker.internal:11434
      think: false

  - model_name: manager-worker-m4-phi
    litellm_params: *m4_fast

  # ---- manager-test-m4-* : opt-in heavier tier, NOT default routes --------
  # INCIDENT 2026-08-12: a direct (non-LiteLLM) load test of qwen3-coder:30b
  # on this Mac ballooned to 31GB resident (18GB weights + KV cache at the
  # model's own default 131072 ctx, which ignores any num_ctx set here
  # unless the request actually goes through LiteLLM) against a 24GB
  # unified pool already sharing Docker/LiteLLM/editor/browser — froze the
  # machine solid, required a hard `kill -9` on the runner process plus
  # `ollama stop` to recover. Real free headroom on this host is well under
  # the raw 24GB spec once normal daily load is accounted for.
  # Explicit-call-only (no fallback chain reaches these), same pattern as
  # manager-test-* in litellm_config.linux.yaml. Do not promote to a
  # manager-worker-m4-* default without a supervised, low-num_ctx test AND
  # closing every other heavy app first.
  - model_name: manager-test-m4-qwen3-coder-30b
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://host.docker.internal:11434
      think: false
      num_ctx: 8192
      temperature: 0.2
      top_p: 0.8

  - model_name: manager-test-m4-qwen3-5-27b
    litellm_params:
      model: ollama_chat/qwen3.5:27b-q4_K_M
      api_base: http://host.docker.internal:11434
      think: false
      num_ctx: 8192
      temperature: 0.2
      top_p: 0.8
  # ---- end manager-test-m4-* -----------------------------------------------

  - model_name: manager-embed
    litellm_params:
      model: openai/nomic-embed-text-v2-moe:latest
      api_base: http://host.docker.internal:11434/v1
      api_key: local

  # Free-cloud consent alias — used when free_cloud_host routes here (nas-host
  # LiteLLM down, or deliberate mac-client free-cloud pin). OpenRouter key from env.
  - model_name: manager-openrouter-free
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  # Cross-host proxy: gbrain's MCP daemon is wired direct to THIS LiteLLM
  # (bypasses Headroom — required carve-out, embeddings 404 through Headroom
  # stack-wide) so it has no way to reach mrgpu's own LiteLLM for its
  # background chat/reasoning tier. This entry lets gbrain still honor
  # mrgpu-first by forwarding straight to mrgpu's Ollama over LAN. Same
  # model (gemma4:12b) as mrgpu's own manager-worker-mrgpu-reason alias —
  # 2026-08-23, root cause: gbrain-gpt-5.6-terra-400-loop.
  - model_name: manager-worker-mrgpu-reason
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://192.168.1.5:11434
      think: false
      num_ctx: 32768
      temperature: 0.2
      top_p: 0.8

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 1
  telemetry: false
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: "90d"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
